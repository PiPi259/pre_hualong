<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>前傳 V2.1 - V50.html</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-touch-callout: none; }
        body {
            background-color: #121218;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        #game-viewport {
            position: relative;
            width: 1680px;
            height: 1026px;
            transform-origin: center center;
            display: flex;
            flex-direction: column;
            background: #000;
            border: 4px solid #2a2a35;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            flex-shrink: 0;
        }

        #fullscreen-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(44, 26, 15, 0.85);
            color: #d4a017;
            border: 2px solid rgba(212, 160, 23, 0.5);
            padding: 6px 14px;
            font-size: 16px;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            border-radius: 6px;
            z-index: 200;
            transition: all 0.2s;
        }
        #fullscreen-btn:hover { background: rgba(69, 43, 26, 0.95); border-color: #f1c40f; color: #f1c40f; }

        #game-container {
            position: relative;
            width: 1680px;
            height: 936px;
            background: #181820;
            overflow: hidden;
            flex-shrink: 0;
        }

        #stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 1680px;
            height: 936px;
            overflow: hidden;
        }

        .wall {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            background-size: 100% 100%;
            background-position: center;
            transition: background-image 0.1s ease-in-out;
        }
        .wall.active { display: block; }

        /* 復古木質棕色道具列 */
        #inventory-container {
            width: 1680px;
            height: 90px;
            background: rgba(44, 26, 15, 0.95);
            backdrop-filter: blur(8px);
            border-top: 2px solid rgba(212, 160, 23, 0.4);
            display: flex;
            align-items: center;
            padding: 0 20px;
            flex-shrink: 0;
            z-index: 50;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
        }
        #inventory {
            display: flex;
            width: 100%;
            height: 70px;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
        }
        .inv-slot {
            flex: 1;
            height: 66px;
            background: rgba(69, 43, 26, 0.85);
            border: 2px solid rgba(212, 160, 23, 0.4);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            position: relative;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            touch-action: none;
        }
        .inv-slot:hover { border-color: rgba(241, 196, 15, 0.9); background: rgba(92, 58, 35, 0.95); }
        .inv-slot:active { cursor: grabbing; }
        .inv-slot img { max-width: 80%; max-height: 80%; pointer-events: none; }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 100px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            font-size: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 40;
            transition: background 0.2s;
        }
        .nav-btn:hover { background: rgba(0,0,0,0.8); }
        #nav-left { left: 0; border-radius: 0 8px 8px 0; }
        #nav-right { right: 0; border-radius: 8px 0 0 8px; }

        .nav-down-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 60px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 8px;
            z-index: 40;
            transition: background 0.2s;
        }
        .nav-down-btn:hover { background: rgba(0, 0, 0, 0.8); }

        .hotspot {
            position: absolute;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        .hotspot:hover { transform: scale(1.05); }
        .hotspot img { width: 100%; height: 100%; object-fit: contain; }

        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 1680px;
            height: 936px;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .manipulate-layer {
            position: absolute;
            cursor: grab;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        .manipulate-layer:active { cursor: grabbing; }

        #modal-tile-board {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 1680px;
            height: 936px;
            background: rgba(15, 15, 20, 0.95);
            z-index: 110;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #game-subtitle {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            font-size: 26px;
            color: #ffffff;
            letter-spacing: 3px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 120;
        }

        #custom-drag-ghost {
            position: fixed;
            width: 50px;
            height: 50px;
            pointer-events: none;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 9999;
        }
        #custom-drag-ghost img { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body onpointermove="onCustomDragMove(event)" onpointerup="onCustomDragEnd(event)">

<button id="fullscreen-btn" onclick="toggleFullscreen()">全螢幕</button>
<div id="custom-drag-ghost"><img id="ghost-img" src="" alt=""></div>

<div id="game-viewport">
    <div id="game-container">
        <div id="stage">
            <div id="nav-left" class="nav-btn" onclick="changeWall(-1)">&lt;</div>
            <div id="nav-right" class="nav-btn" onclick="changeWall(1)">&gt;</div>

            <div id="game-subtitle">過不去……</div>

            <!-- 北牆 (bg_north.png) -->
            <div class="wall active" id="wall-0" style="background-image: url('images/bg_north.png');">
                <!-- ① 皮箱熱點 -->
                <div class="hotspot" style="top: 500px; left: 700px; width: 260px; height: 80px;" onclick="enterSafeView()"></div>
                <!-- ② 解碼表熱點 -->
                <div class="hotspot" style="top: 650px; left: 790px; width: 90px; height: 90px;" onclick="enterChartView()"></div>
                <!-- ◆圖板 (item_d_ghostleg.png) -->
                <div id="hp-tile-board" class="hotspot" style="bottom:60px; right:200px; width:130px;" onclick="pickUp('tile_board', 'images/item_d_ghostleg.png', 'hp-tile-board', '爬梯子？圈叉？')">
                    <img src="images/item_d_ghostleg.png" alt="">
                </div>
            </div>

            <!-- 北牆皮箱密碼鎖放大視角 (bg_north_box.png) -->
            <div class="wall" id="wall-safe-view" style="background-image: url('images/bg_north_box.png');">
                <!-- 密碼鎖點擊熱點 -->
                <div id="safe-hotspot" class="hotspot" style="top: 520px; left: 700px; width: 280px; height: 120px;" onclick="toggleSafeInputBox()"></div>
                
                <!-- 密碼輸入框與開啟按鈕 -->
                <div id="safe-input-container" style="display:none; position:absolute; top: 520px; left: 700px; width: 280px; height: 120px; flex-direction:column; gap:10px; z-index:45; align-items:center; justify-content:center;">
                    <input type="text" id="safe-input" placeholder="★ ▲ ◎ ◆" maxlength="4" style="font-size:26px; text-align:center; width:200px; padding:6px; letter-spacing:4px; background:#111; color:#fff; border:1px solid #666;">
                    <button onclick="checkPassword()" style="padding:6px 20px; font-size:16px; background:#6d4c41; color:#fff; border:none; cursor:pointer; border-radius:4px;">開啟</button>
                </div>

                <div class="nav-down-btn" onclick="returnFromSafeView()">&or;</div>
            </div>

            <!-- 解碼表特寫大圖背景 (bg_north_chart.png) -->
            <div class="wall" id="wall-chart-view" style="background-image: url('images/bg_north_chart.png');">
                <div class="nav-down-btn" onclick="returnFromChartView()">&or;</div>
            </div>

            <!-- 東牆 (bg_east.png) -->
            <div class="wall" id="wall-1" style="background-image: url('images/bg_east.png');">
                <div class="hotspot" style="bottom:95px; right:155px; width:300px; height:260px;" onclick="enterDrawerView()"></div>
                <div id="hp-orange" class="hotspot" style="bottom:365px; right:260px; width:80px;" onclick="pickUp('orange', 'images/item_c_orange.png', 'hp-orange', '軌道邊的哦潤吉？')">
                    <img src="images/item_c_orange.png" alt="">
                </div>
                <div class="hotspot" style="top:354px; left:390px; width:176px; height:126px;" onclick="enterBaseboardView()"></div>
            </div>

            <!-- 東面櫃子近景背景視角 (bg_east_drawer.png) -->
            <div class="wall" id="wall-drawer-view" style="background-image: url('images/bg_east_drawer.png');">
                <div class="hotspot" style="top: 325px; left: 370px; width: 940px; height: 140px;" onclick="openDrawerLayer(1)"></div>
                <div class="hotspot" style="top: 475px; left: 370px; width: 940px; height: 140px;" onclick="openDrawerLayer(2)"></div>
                <div class="hotspot" style="top: 625px; left: 370px; width: 940px; height: 140px;" onclick="openDrawerLayer(3)"></div>
                <div class="nav-down-btn" onclick="returnFromDrawerView()">&or;</div>
            </div>

            <!-- 上層抽屜拉開近景背景 (bg_east_drawer_1.png) -->
            <div class="wall" id="wall-drawer-1-open" style="background-image: url('images/bg_east_drawer_1.png');">
                <div id="drawer-item-overlay" class="hotspot" style="top:440px; left:750px; width:120px;" onclick="pickUpDrawerItem('overlay', 'images/item_t_overlay.png', 'drawer-item-overlay', '這是三角？')">
                    <img src="images/item_t_overlay.png" alt="">
                </div>
                <div class="hotspot" style="top: 325px; left: 370px; width: 940px; height: 140px;" onclick="enterDrawerView()"></div>
            </div>

            <!-- 中層抽屜拉開近景背景 (bg_east_drawer_2.png) -->
            <div class="wall" id="wall-drawer-2-open" style="background-image: url('images/bg_east_drawer_2.png');">
                <div id="drawer-item-tile-wrong" class="hotspot" style="top:430px; left:740px; width:130px;" onclick="pickUpDrawerItem('tile_wrong', 'images/item_d_wrong.png', 'drawer-item-tile-wrong', '好像可以跟什麼拚在一起')">
                    <img src="images/item_d_wrong.png" alt="">
                </div>
                <div class="hotspot" style="top: 475px; left: 370px; width: 940px; height: 140px;" onclick="enterDrawerView()"></div>
            </div>

            <!-- 下層抽屜拉開近景背景 (bg_east_drawer_3.png) -->
            <div class="wall" id="wall-drawer-3-open" style="background-image: url('images/bg_east_drawer_3.png');">
                <div id="drawer-item-lemon" class="hotspot" style="top:430px; left:740px; width:130px;" onclick="pickUpDrawerItem('lemon', 'images/item_c_lemon.png', 'drawer-item-lemon', '那一天的憂鬱，憂鬱起來')">
                    <img src="images/item_c_lemon.png" alt="">
                </div>
                <div class="hotspot" style="top: 625px; left: 370px; width: 940px; height: 140px;" onclick="enterDrawerView()"></div>
            </div>

            <!-- 南牆 (bg_south.png) -->
            <div class="wall" id="wall-2" style="background-image: url('images/bg_south.png');">
                <div class="hotspot" style="top:220px; left:590px; width:500px; height:500px;" onclick="showSubtitle('過不去……')"></div>
                <div id="hp-peach" class="hotspot" style="bottom:120px; left:730px; width:100px;" onclick="pickUp('peach', 'images/item_c_peach.png', 'hp-peach', '一顆水蜜桃')">
                    <img src="images/item_c_peach.png" alt="">
                </div>
            </div>

            <!-- 西牆 (bg_west.png) -->
            <div class="wall" id="wall-3" style="background-image: url('images/bg_west.png');">
                <div class="hotspot" style="top:430px; left:480px; width:300px; height:120px;" onclick="enterBasketView()"></div>
                <div id="hp-apple" class="hotspot" style="bottom:130px; left:540px; width:80px;" onclick="pickUp('apple', 'images/item_c_apple.png', 'hp-apple', '不是bad apple')">
                    <img src="images/item_c_apple.png" alt="">
                </div>
                <div id="hp-corner-tile" class="hotspot" style="bottom:190px; right:110px; width:70px; height:70px;" onclick="pickUp('tile_correct', 'images/item_d_correct_back.png', 'hp-corner-tile', '梯形的板塊？')">
                    <img src="images/item_d_correct_back.png" alt="" style="opacity:0.95;">
                </div>
            </div>

            <!-- 西牆近景 (bg_west_basket.png) -->
            <div class="wall" id="wall-basket" style="background-image: url('images/bg_west_basket.png');" onpointerup="dropIntoBasket(event)">
                <div id="basket-click-area" style="position:absolute; top:330px; left:660px; width:360px; height:280px; cursor:pointer; display:flex; justify-content:center; align-items:center;" onclick="handleBasketClick()">
                    <img id="basket-center-fruit" src="" style="max-width:70%; max-height:70%; object-fit:contain; display:none;" alt="">
                </div>
                <div class="nav-down-btn" onclick="returnFromBasket()">&or;</div>
            </div>

            <!-- ▲海報近景背景視角 (bg_east_baseboard.png) -->
            <div class="wall" id="wall-baseboard" style="background-image: url('images/bg_east_baseboard.png');" onpointerup="dropIntoBaseboard(event)">
                <div id="baseboard-overlay-layer" class="manipulate-layer" style="display:none; width:560px; top:200px; left:560px;" onpointerdown="startTriangleInteraction(event)">
                    <img id="baseboard-overlay-img" src="images/item_t_overlay.png" style="width:100%; pointer-events:none;" alt="">
                </div>
                <div class="nav-down-btn" onclick="returnFromBaseboard()">&or;</div>
            </div>

            <!-- 道具大圖檢視 (按鈕為「翻面」) -->
            <div id="modal-item-detail" class="modal" onclick="closeModal('modal-item-detail')">
                <div style="position:relative; width:500px; height:420px; display:flex; justify-content:center; align-items:center; cursor:pointer;" onclick="event.stopPropagation(); showItemDescription();">
                    <img id="detail-item-img" style="max-width:90%; max-height:90%; object-fit:contain;" alt="">
                </div>
                <div id="detail-ctrl-panel" style="margin-top: 15px; display: none; z-index: 105;" onclick="event.stopPropagation()">
                    <button onclick="flipInspectedTile()" style="padding: 10px 24px; font-size: 18px; background: #2a2a38; color: #fff; border: 1px solid #777; border-radius: 6px; cursor: pointer;">翻面</button>
                </div>
            </div>

            <!-- ◆圖板解謎模式 Modal -->
            <div id="modal-tile-board" onclick="closeTileBoardModal()" onpointerup="dropIntoTileBoard(event)">
                <div style="position:relative; width:700px; height:500px; display:flex; justify-content:center; align-items:center;" onclick="event.stopPropagation()">
                    <img src="images/item_d_ghostleg.png" style="max-width:90%; max-height:90%; object-fit:contain;" alt="◆圖板">
                    <div id="tile-board-placed-layer" class="manipulate-layer" style="display:none; width:317.6px; top:133px; left:191px;" onpointerdown="startTileInteraction(event)">
                        <img id="placed-tile-img" src="" style="width:100%; height:auto; object-fit:contain; pointer-events:none;" alt="">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 下方道具欄 -->
    <div id="inventory-container">
        <div id="inventory"></div>
    </div>
</div>

<script>
    const preloadImages = [
        'images/bg_north.png', 'images/bg_north_box.png', 'images/bg_north_chart.png',
        'images/bg_east.png', 'images/bg_east_baseboard.png', 'images/bg_east_drawer.png',
        'images/bg_east_drawer_1.png', 'images/bg_east_drawer_2.png', 'images/bg_east_drawer_3.png',
        'images/bg_south.png', 'images/bg_west.png', 'images/bg_west_basket.png',
        'images/item_s_rulebook.png', 'images/item_c_apple.png', 'images/item_c_strawberry.png',
        'images/item_c_lemon.png', 'images/item_c_peach.png', 'images/item_c_orange.png',
        'images/item_t_overlay.png', 'images/item_d_ghostleg.png', 'images/item_d_correct.png',
        'images/item_d_correct_back.png', 'images/item_d_wrong.png', 'images/item_d_wrong_back.png',
        'images/an_c_glowing.png'
    ];
    preloadImages.forEach(src => { const img = new Image(); img.src = src; });

    function resizeGame() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        let scale = Math.min(vw / 1680, vh / 1026);
        document.getElementById('game-viewport').style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', resizeGame);
    window.addEventListener('load', resizeGame);

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                alert(`無法啟用全螢幕模式: ${err.message}`);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    let currentWall = 0;
    function changeWall(dir) {
        document.querySelectorAll('.wall').forEach(w => w.classList.remove('active'));
        currentWall = (currentWall + dir + 4) % 4;
        document.getElementById(`wall-${currentWall}`).classList.add('active');
        document.getElementById('nav-left').style.display = 'flex';
        document.getElementById('nav-right').style.display = 'flex';
    }

    function enterSafeView() {
        document.querySelectorAll('.wall').forEach(w => w.classList.remove('active'));
        document.getElementById('wall-safe-view').classList.add('active');
        document.getElementById('nav-left').style.display = 'none';
        document.getElementById('nav-right').style.display = 'none';
        currentWall = 'safe-view';
    }
    function returnFromSafeView() {
        document.querySelectorAll('.wall').forEach(w => w.classList.remove('active'));
        currentWall = 0;
        document.getElementById(`wall-${currentWall}`).classList.add('active');
        document.getElementById('nav-left').style.display = 'flex';
        document.getElementById('nav-right').style.display = 'flex';
        document.getElementById('safe-input-container').style.display = 'none';
        document.getElementById('safe-hotspot').style.display = 'block';
        document.getElementById('safe-input').value = '';
    }

    function enterChartView() {
        document.querySelectorAll('.wall').forEach(w => w.classList.remove('active'));
        document.getElementById('wall-chart-view').classList.add('active');
        document.getElementById('nav-left').style.display = 'none';
        document.getElementById('nav-right').style.display = 'none';
        currentWall = 'chart-view';
    }
    function returnFromChartView() {
        document.querySelectorAll('.wall').forEach(w => w.classList.remove('active'));
        currentWall = 0;
        document.getElementById(`wall-${currentWall}`).classList.add('active');
        document.getElementById('nav-left').style.display = 'flex';
        document.getElementById('nav-right').style.display = 'flex';
    }

    function enterDrawerView() {
        document.querySelectorAll('.wall').forEach(w => w.classList.remove('active'));
        document.getElementById('wall-drawer-view').classList.add('active');
        document.getElementById('nav-left').style.display = 'none';
        document.getElementById('nav-right').style.display = 'none';
        currentWall = 'drawer-view';
    }
    function returnFromDrawerView() {
        document.querySelectorAll('.wall').forEach(w => w.classList.remove('active'));
        currentWall = 1;
        document.getElementById(`wall-${currentWall}`).classList.add('active');
        document.getElementById('nav-left').style.display = 'flex';
        document.getElementById('nav-right').style.display = 'flex';
    }

    let drawerItemsStatus = { overlay: false, tile_wrong: false, lemon: false };

    function openDrawerLayer(layerNum) {
        document.querySelectorAll('.wall').forEach(w => w.classList.remove('active'));
        if (layerNum === 1) {
            document.getElementById('wall-drawer-1-open').classList.add('active');
            document.getElementById('drawer-item-overlay').style.display = drawerItemsStatus.overlay ? 'none' : 'block';
        } else if (layerNum === 2) {
            document.getElementById('wall-drawer-2-open').classList.add('active');
            document.getElementById('drawer-item-tile-wrong').style.display = drawerItemsStatus.tile_wrong ? 'none' : 'block';
        } else if (layerNum === 3) {
            document.getElementById('wall-drawer-3-open').classList.add('active');
            document.getElementById('drawer-item-lemon').style.display = drawerItemsStatus.lemon ? 'none' : 'block';
        }
    }

    function pickUpDrawerItem(id, imgPath, elId, customDesc) {
        let emptyIdx = inventory.findIndex(x => x === null);
        if (emptyIdx !== -1) {
            inventory[emptyIdx] = { id: id, name: customDesc || id, img: imgPath };
            drawerItemsStatus[id] = true;
            document.getElementById(elId).style.display = 'none';
            renderInventory();
        } else {
            alert("背包已滿！");
        }
    }

    let currentFruitInBasket = { id: 'strawberry', name: '這草莓怎麼這麼大顆', img: 'images/item_c_strawberry.png' };

    function updateBasketCenterFruit() {
        const fruitImg = document.getElementById('basket-center-fruit');
        if (!currentFruitInBasket) {
            fruitImg.style.display = 'none';
            fruitImg.src = '';
        } else {
            if (currentFruitInBasket.id === 'lemon') {
                fruitImg.src = 'images/an_c_glowing.png';
            } else {
                fruitImg.src = currentFruitInBasket.img;
            }
            fruitImg.style.display = 'block';
        }
    }

    function enterBasketView() {
        document.querySelectorAll('.wall').forEach(w => w.classList.remove('active'));
        updateBasketCenterFruit();
        document.getElementById('wall-basket').classList.add('active');
        document.getElementById('nav-left').style.display = 'none';
        document.getElementById('nav-right').style.display = 'none';
        currentWall = 'basket';
    }

    function returnFromBasket() {
        document.querySelectorAll('.wall').forEach(w => w.classList.remove('active'));
        currentWall = 3;
        document.getElementById(`wall-${currentWall}`).classList.add('active');
        document.getElementById('nav-left').style.display = 'flex';
        document.getElementById('nav-right').style.display = 'flex';
    }

    function handleBasketClick() {
        if (currentFruitInBasket) {
            let emptyIdx = inventory.findIndex(x => x === null);
            if (emptyIdx !== -1) {
                if (currentFruitInBasket.id === 'lemon') {
                    inventory[emptyIdx] = { id: 'lemon', name: '那一天的憂鬱，憂鬱起來', img: 'images/item_c_lemon.png' };
                } else {
                    inventory[emptyIdx] = currentFruitInBasket;
                }
                currentFruitInBasket = null;
                renderInventory();
                updateBasketCenterFruit();
            } else {
                alert("背包已滿，無法取回！");
            }
        }
    }

    function enterBaseboardView() {
        document.querySelectorAll('.wall').forEach(w => w.classList.remove('active'));
        document.getElementById('wall-baseboard').classList.add('active');
        document.getElementById('nav-left').style.display = 'none';
        document.getElementById('nav-right').style.display = 'none';
        currentWall = 'baseboard';
    }

    function returnFromBaseboard() {
        if (currentOverlayInBaseboard) {
            let emptyIdx = inventory.findIndex(x => x === null);
            if (emptyIdx !== -1) {
                inventory[emptyIdx] = currentOverlayInBaseboard;
            } else {
                inventory[0] = currentOverlayInBaseboard;
            }
            currentOverlayInBaseboard = null;
            renderInventory();
            document.getElementById('baseboard-overlay-layer').style.display = 'none';
        }

        document.querySelectorAll('.wall').forEach(w => w.classList.remove('active'));
        currentWall = 1;
        document.getElementById(`wall-${currentWall}`).classList.add('active');
        document.getElementById('nav-left').style.display = 'flex';
        document.getElementById('nav-right').style.display = 'flex';
    }

    const TOTAL_SLOTS = 10;
    let inventory = new Array(TOTAL_SLOTS).fill(null);
    inventory[0] = { id: 'rulebook', name: '好像是進來前被塞的守則', img: 'images/item_s_rulebook.png' };
    
    let currentInspectedItem = null;
    let currentInspectedSlotIndex = null;
    let subtitleTimeout = null;

    function showSubtitle(text) {
        const subtitle = document.getElementById('game-subtitle');
        subtitle.innerText = text;
        subtitle.style.opacity = '1';
        if (subtitleTimeout) clearTimeout(subtitleTimeout);
        subtitleTimeout = setTimeout(() => {
            subtitle.style.opacity = '0';
        }, 2500);
    }

    function initInventoryDOM() {
        const container = document.getElementById('inventory');
        container.innerHTML = '';
        for (let i = 0; i < TOTAL_SLOTS; i++) {
            const slot = document.createElement('div');
            slot.className = 'inv-slot';
            slot.id = `slot-${i}`;
            slot.onpointerdown = (e) => startCustomDrag(e, i);
            slot.onclick = () => handleSlotClick(i);
            container.appendChild(slot);
        }
        renderInventory();
    }

    function renderInventory() {
        for (let i = 0; i < TOTAL_SLOTS; i++) {
            let slot = document.getElementById(`slot-${i}`);
            if (!slot) continue;
            if (inventory[i]) {
                slot.innerHTML = `<img src="${inventory[i].img}" alt="">`;
            } else {
                slot.innerHTML = '';
            }
        }
    }

    let draggingSlotIndex = -1;
    let isDragging = false;
    let lastClientX = 0;
    let lastClientY = 0;

    function startCustomDrag(e, index) {
        if (!inventory[index]) return;
        draggingSlotIndex = index;
        isDragging = true;
        lastClientX = e.clientX;
        lastClientY = e.clientY;
        const ghost = document.getElementById('custom-drag-ghost');
        document.getElementById('ghost-img').src = inventory[index].img;
        ghost.style.display = 'block';
        ghost.style.left = e.clientX + 'px';
        ghost.style.top = e.clientY + 'px';
        e.preventDefault();
    }

    function onCustomDragMove(e) {
        if (!isDragging) return;
        lastClientX = e.clientX;
        lastClientY = e.clientY;
        const ghost = document.getElementById('custom-drag-ghost');
        ghost.style.left = e.clientX + 'px';
        ghost.style.top = e.clientY + 'px';
    }

    function onCustomDragEnd(e) {
        if (!isDragging) return;
        isDragging = false;
        document.getElementById('custom-drag-ghost').style.display = 'none';

        // 建立一個合成事件物件，支援手機端 pointerup 抓不到 clientX/clientY 的問題
        let syntheticEvent = {
            clientX: e.clientX !== undefined && e.clientX !== 0 ? e.clientX : lastClientX,
            clientY: e.clientY !== undefined && e.clientY !== 0 ? e.clientY : lastClientY
        };

        if (currentWall === 'basket') {
            dropIntoBasket(syntheticEvent);
        } else if (currentWall === 'baseboard') {
            dropIntoBaseboard(syntheticEvent);
        }

        draggingSlotIndex = -1;
    }

    function dropIntoBasket(e) {
        if (draggingSlotIndex === -1) return;
        let item = inventory[draggingSlotIndex];
        if (['apple', 'strawberry', 'lemon', 'peach', 'orange'].includes(item.id)) {
            if (currentFruitInBasket) {
                showSubtitle("一次只能放一顆，這些水果太大顆了");
            } else {
                currentFruitInBasket = item;
                inventory[draggingSlotIndex] = null;
                renderInventory();
                updateBasketCenterFruit();
            }
        }
    }

    let placedTileInBoard = null;
    let boardTileRotation = 0;
    let boardTileFlipped = false;

    function dropIntoTileBoard(e) {
        if (draggingSlotIndex === -1) return;
        let item = inventory[draggingSlotIndex];
        if (item.id === 'tile_correct' || item.id === 'tile_wrong') {
            if (placedTileInBoard) {
                inventory[draggingSlotIndex] = placedTileInBoard;
            } else {
                inventory[draggingSlotIndex] = null;
            }

            placedTileInBoard = item;
            renderInventory();

            boardTileRotation = 0;
            boardTileFlipped = false;

            const imgEl = document.getElementById('placed-tile-img');
            imgEl.src = item.img;
            document.getElementById('tile-board-placed-layer').style.display = 'flex';
        }
    }

    function closeTileBoardModal() {
        document.getElementById('modal-tile-board').style.display = 'none';
        if (placedTileInBoard) {
            let emptyIdx = inventory.findIndex(x => x === null);
            if (emptyIdx !== -1) {
                inventory[emptyIdx] = placedTileInBoard;
            } else {
                inventory[0] = placedTileInBoard;
            }
            placedTileInBoard = null;
            renderInventory();
            document.getElementById('tile-board-placed-layer').style.display = 'none';
        }
    }

    let boardInteractionMode = null;
    let boardStartX = 0, boardStartY = 0;
    let boardInitialAngle = 0;
    let boardStartMouseAngle = 0;

    function startTileInteraction(e) {
        const layer = document.getElementById('tile-board-placed-layer');
        const rect = layer.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const distX = e.clientX - centerX;
        const distY = e.clientY - centerY;
        const distanceFromCenter = Math.sqrt(distX * distX + distY * distY);
        const radius = rect.width / 2;

        if (distanceFromCenter > radius * 0.6) {
            boardInteractionMode = 'rotate';
            boardStartMouseAngle = Math.atan2(e.clientY - centerY, e.clientX - centerX) * (180 / Math.PI);
            boardInitialAngle = boardTileRotation;
        } else {
            boardInteractionMode = 'drag';
            boardStartX = e.clientX - layer.offsetLeft;
            boardStartY = e.clientY - layer.offsetTop;
        }

        document.addEventListener('pointermove', onBoardTileMouseMove);
        document.addEventListener('pointerup', onBoardTileMouseUp);
        e.stopPropagation();
        e.preventDefault();
    }

    function onBoardTileMouseMove(e) {
        const layer = document.getElementById('tile-board-placed-layer');
        if (boardInteractionMode === 'drag') {
            layer.style.left = (e.clientX - boardStartX) + 'px';
            layer.style.top = (e.clientY - boardStartY) + 'px';
        } else if (boardInteractionMode === 'rotate') {
            const rect = layer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const currentMouseAngle = Math.atan2(e.clientY - centerY, e.clientX - centerX) * (180 / Math.PI);
            let angleDiff = currentMouseAngle - boardStartMouseAngle;
            boardTileRotation = boardInitialAngle + angleDiff;
            updateBoardTileTransform();
        }
    }

    function onBoardTileMouseUp() {
        boardInteractionMode = null;
        document.removeEventListener('pointermove', onBoardTileMouseMove);
        document.removeEventListener('pointerup', onBoardTileMouseUp);
    }

    function updateBoardTileTransform() {
        const layer = document.getElementById('tile-board-placed-layer');
        let scaleX = boardTileFlipped ? -1 : 1;
        layer.style.transform = `rotate(${boardTileRotation}deg) scaleX(${scaleX})`;
    }

    let selectedSlotIndex = null;
    function handleSlotClick(index) {
        if (!inventory[index]) {
            selectedSlotIndex = null;
            return;
        }
        if (selectedSlotIndex === index) {
            currentInspectedItem = inventory[index];
            currentInspectedSlotIndex = index;
            if (currentInspectedItem.id === 'tile_board') {
                showSubtitle(currentInspectedItem.name);
                document.getElementById('modal-tile-board').style.display = 'flex';
            } else {
                openItemDetail(currentInspectedItem);
            }
            selectedSlotIndex = null;
        } else {
            selectedSlotIndex = index;
        }
    }

    function openItemDetail(item) {
        document.getElementById('detail-item-img').src = item.img;
        const ctrlPanel = document.getElementById('detail-ctrl-panel');
        if (item.id === 'tile_correct' || item.id === 'tile_wrong') {
            ctrlPanel.style.display = 'block';
        } else {
            ctrlPanel.style.display = 'none';
        }
        document.getElementById('modal-item-detail').style.display = 'flex';
    }

    function flipInspectedTile() {
        if (!currentInspectedItem || (currentInspectedItem.id !== 'tile_correct' && currentInspectedItem.id !== 'tile_wrong')) return;
        let isBack = currentInspectedItem.img.includes('back');
        let newImg = '';
        if (currentInspectedItem.id === 'tile_correct') {
            newImg = isBack ? 'images/item_d_correct.png' : 'images/item_d_correct_back.png';
        } else {
            newImg = isBack ? 'images/item_d_wrong.png' : 'images/item_d_wrong_back.png';
        }
        currentInspectedItem.img = newImg;
        document.getElementById('detail-item-img').src = newImg;
        renderInventory();
        if (placedTileInBoard && placedTileInBoard === currentInspectedItem) {
            document.getElementById('placed-tile-img').src = newImg;
        }
    }

    function showItemDescription() {
        if (currentInspectedItem && currentInspectedItem.name) {
            showSubtitle(currentInspectedItem.name);
        }
    }

    function pickUp(id, imgPath, elId, customDesc) {
        let emptyIdx = inventory.findIndex(x => x === null);
        if (emptyIdx !== -1) {
            let targetEl = document.getElementById(elId);
            inventory[emptyIdx] = { id: id, name: customDesc || id, img: imgPath };
            if (targetEl) targetEl.style.display = 'none';
            renderInventory();
        } else {
            alert("背包已滿！");
        }
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    let currentOverlayInBaseboard = null;
    let baseboardRotation = 0;
    let baseboardInteractionMode = null;
    let baseboardStartX = 0, baseboardStartY = 0;
    let baseboardInitialAngle = 0;
    let baseboardStartMouseAngle = 0;

    function dropIntoBaseboard(e) {
        if (draggingSlotIndex === -1) return;
        let item = inventory[draggingSlotIndex];
        if (item.id === 'overlay') {
            currentOverlayInBaseboard = item;
            inventory[draggingSlotIndex] = null;
            renderInventory();

            baseboardRotation = 0;

            const box = document.getElementById('wall-baseboard');
            const rect = box.getBoundingClientRect();
            let relX = e.clientX - rect.left - 280;
            let relY = e.clientY - rect.top - 280;

            const overlayLayer = document.getElementById('baseboard-overlay-layer');
            overlayLayer.style.display = 'flex';
            overlayLayer.style.left = relX + 'px';
            overlayLayer.style.top = relY + 'px';
            updateBaseboardTransform();
        }
    }

    function startTriangleInteraction(e) {
        const layer = document.getElementById('baseboard-overlay-layer');
        const rect = layer.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const distX = e.clientX - centerX;
        const distY = e.clientY - centerY;
        const distanceFromCenter = Math.sqrt(distX * distX + distY * distY);
        const radius = rect.width / 2;

        if (distanceFromCenter > radius * 0.5) {
            baseboardInteractionMode = 'rotate';
            baseboardStartMouseAngle = Math.atan2(e.clientY - centerY, e.clientX - centerX) * (180 / Math.PI);
            baseboardInitialAngle = baseboardRotation;
        } else {
            baseboardInteractionMode = 'drag';
            baseboardStartX = e.clientX - layer.offsetLeft;
            baseboardStartY = e.clientY - layer.offsetTop;
        }

        document.addEventListener('pointermove', onTriangleMouseMove);
        document.addEventListener('pointerup', onTriangleMouseUp);
        e.stopPropagation();
        e.preventDefault();
    }

    function onTriangleMouseMove(e) {
        const layer = document.getElementById('baseboard-overlay-layer');
        if (baseboardInteractionMode === 'drag') {
            layer.style.left = (e.clientX - baseboardStartX) + 'px';
            layer.style.top = (e.clientY - baseboardStartY) + 'px';
        } else if (baseboardInteractionMode === 'rotate') {
            const rect = layer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const currentMouseAngle = Math.atan2(e.clientY - centerY, e.clientX - centerX) * (180 / Math.PI);
            let angleDiff = currentMouseAngle - baseboardStartMouseAngle;
            baseboardRotation = baseboardInitialAngle + angleDiff;
            updateBaseboardTransform();
        }
    }

    function onTriangleMouseUp() {
        baseboardInteractionMode = null;
        document.removeEventListener('pointermove', onTriangleMouseMove);
        document.removeEventListener('pointerup', onTriangleMouseUp);
    }

    function updateBaseboardTransform() {
        const layer = document.getElementById('baseboard-overlay-layer');
        layer.style.transform = `rotate(${baseboardRotation}deg)`;
    }

    function toggleSafeInputBox() {
        document.getElementById('safe-hotspot').style.display = 'none';
        document.getElementById('safe-input-container').style.display = 'flex';
        document.getElementById('safe-input').focus();
    }

    function checkPassword() {
        let val = document.getElementById('safe-input').value.trim();
        if (val === '1948') {
            alert("任務達成");
        } else {
            alert("錯誤！請重新確認。");
        }
    }

    initInventoryDOM();
    resizeGame();
</script>

</body>
</html>
